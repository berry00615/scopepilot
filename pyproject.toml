[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scopepilot"
version = "0.2.0"
description = "Offline, authorization-aware security research workbench"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
scopepilot = "scopepilot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scopepilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
